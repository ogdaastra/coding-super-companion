[package]
name = "neuroform-wasm"
description = "C-ABI WebAssembly bindings for neuroform-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neuroform-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
